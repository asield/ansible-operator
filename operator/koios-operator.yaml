      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Restore de un KoiosPlatformBackup en un KoiosPlatform nuevo.
          Solo crea objetos del destino; nunca escribe en los de otra instancia (decisión
          R4-API-01).
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              backup_dir:
                description: Directorio del backup en los PVC (si no se usa backup_name).
                type: string
              backup_name:
                description: KoiosPlatformBackup de origen (Successful). Alternativa
                  a backup_dir + backup_pvc.
                type: string
              controller:
                properties:
                  backup_pvc:
                    description: PVC del componente controller (si no se usa backup_name).
                    type: string
                type: object
              deployment_name:
                description: KoiosPlatform destino, en el mismo namespace; no puede
                  existir.
                minLength: 1
                type: string
              gateway:
