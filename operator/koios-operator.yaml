apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: koiosplatforms.platform.koioss.com
spec:
  group: platform.koioss.com
  names:
    kind: KoiosPlatform
    listKind: KoiosPlatformList
    plural: koiosplatforms
    singular: koiosplatform
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.controller
      name: Controller
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Plataforma Koios (gateway Jewel + Envoy, UI y AWX hijo) reconciliada
          como un todo.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              controller:
                description: Campos del spec AWX (awx.ansible.com/v1beta1) para el
                  AWX hijo. El operador los combina con los que exige la plataforma
                  (extra_settings de resource server y JWT, api_urlpattern_prefix,
                  ingress_type none, base de datos compartida); en conflicto prevalecen
                  los de la plataforma.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              database:
                description: PostgreSQL compartido de la plataforma, un usuario por
                  componente (decisión 2026-10-24).
                properties:
                  external_secret:
                    description: Secret existente con la conexión de un PostgreSQL
                      externo (solo si managed=false).
                    type: string
                  image:
                    type: string
                  image_version:
                    description: Tag o sha256:<digest>.
                    type: string
                  managed:
                    default: true
                    description: true = lo despliega el operador; false = usar external_secret.
                    type: boolean
                  storage_class:
                    type: string
                  storage_size:
                    type: string
                type: object
              gateway:
                description: Jewel + Envoy en el mismo pod; sin CR propio.
                properties:
                  envoy_image:
                    type: string
                  envoy_image_version:
                    type: string
                  image:
                    type: string
                  image_version:
                    type: string
                  replicas:
                    default: 1
                    minimum: 1
                    type: integer
                  resource_requirements:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              image_pull_secrets:
                description: Secrets de pull existentes; se propagan a todos los componentes,
                  también a los pods de job.
                items:
                  type: string
                type: array
              ingress:
                description: Exposición en el borde; el tráfico interno va por HTTP
                  dentro del clúster.
                properties:
                  hostname:
                    type: string
                  ingress_class:
                    type: string
                  tls_secret:
                    type: string
                  type:
                    default: none
                    enum:
                    - none
                    - ingress
                    - loadbalancer
                    type: string
                type: object
              no_log:
                default: true
                description: Oculta valores sensibles en el log del operador; no desactivar
                  fuera de depuración.
                type: boolean
              public_base_url:
                description: URL externa de la plataforma (la del borde Envoy/Ingress).
                type: string
              redis:
                description: Redis compartido con ACL por componente (decisión 2026-10-24).
                properties:
                  image:
                    type: string
                  image_version:
                    type: string
                  mode:
                    default: standalone
                    enum:
                    - standalone
                    type: string
                type: object
              ui:
                properties:
                  enabled:
                    default: true
                    type: boolean
                  image:
                    type: string
                  image_version:
                    type: string
                type: object
            type: object
          status:
            description: 'Estado agregado: conditions (Running/Successful/Failure),
              controller (nombre del AWX hijo), version, gatewayImage, adminUser y
              nombres (nunca valores) de los Secrets.'
            type: object
            x-kubernetes-preserve-unknown-fields: true
        type: object
    served: true
    storage: true
    subresources:
      status: {}
