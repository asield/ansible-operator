apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: koiosplatformbackups.platform.koioss.com
spec:
  group: platform.koioss.com
  names:
    kind: KoiosPlatformBackup
    listKind: KoiosPlatformBackupList
    plural: koiosplatformbackups
    singular: koiosplatformbackup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deployment_name
      name: Platform
      type: string
    - jsonPath: .status.backupDirectory
      name: Directory
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Backup de un KoiosPlatform, un PVC por componente como en AAP
          (decisión R4-API-01).
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              backup_storage_class:
                description: StorageClass de los PVC que crea el backup.
                type: string
              backup_storage_requirements:
                description: Tamaño de cada PVC creado (por defecto 5Gi).
                type: string
              clean_backup_on_delete:
                default: false
                description: Al borrar el CR, borra el directorio de cada componente
                  y los PVC que creó este backup (por UID). Un PVC proporcionado por
                  el usuario nunca se borra.
                type: boolean
              controller:
                properties:
                  backup_pvc:
                    description: PVC existente para el componente controller; vacío
                      = se crea uno.
                    type: string
                type: object
              deployment_name:
                description: KoiosPlatform de origen, en el mismo namespace.
                minLength: 1
                type: string
              gateway:
                properties:
                  backup_pvc:
                    description: PVC existente para el componente gateway; vacío =
                      se crea uno.
                    type: string
                type: object
              no_log:
                default: true
                type: boolean
            required:
            - deployment_name
            type: object
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
        type: object
    served: true
    storage: true
    subresources:
      status: {}
